[package]
name = "bb-auth"
version = "1.0.0"
edition = "2021"
description = "Minimal, service-agnostic Cognito id_token → session-cookie auth gate (nginx auth_request)"
license = "MIT"

# The access file — schema, parser, URL matcher, grant model. The ONE thing the gate and
# the admin CLI must agree on, so there is one implementation of it and both link this.
# Everything else about the gate stays in src/bin/bb-auth.rs. Named `bb_auth_core` rather than
# `bb_auth` because a lib and a bin with the same name collide in `cargo doc`.
[lib]
name = "bb_auth_core"
path = "src/lib.rs"

[[bin]]
name = "bb-auth"
path = "src/bin/bb-auth.rs"

# The access-file admin CLI: CRUD over applications / scopes / user_groups / denied /
# users / api_keys,
# validated with the gate's own parser before it writes. Links the lib, none of the gate.
[[bin]]
name = "bb-auth-adm"
path = "src/bin/bb-auth-adm.rs"

# The access-file admin GUI: the same file, server-rendered, read and write. Every edit goes
# through the library's AccessWrite, exactly as bb-auth-adm's does. Loopback only, behind the
# gate's own auth_request — it is just another app bb-auth fronts. Links the lib, none of the
# gate. Deployed as its own hardened unit (deploy/bb-auth-web.service), optional like the CLI.
[[bin]]
name = "bb-auth-web"
path = "src/bin/bb-auth-web.rs"

[dependencies]
# Tiny blocking, threaded HTTP server — pure Rust, no async runtime (low resident memory).
tiny_http = "0.12"
# Blocking HTTP client for the JWKS fetch. rustls (ring) + bundled Mozilla roots,
# so NO system OpenSSL / cert store is needed → clean aarch64 cross-compile.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# RS256 id_token validation (signature via JWKS, iss/aud/exp). Pure RustCrypto, so it
# brings no crypto stack of its own to cross-compile and leaves `ring` to rustls alone.
#
# `rust_crypto` IS THE CRYPTO, and it is not a default: jsonwebtoken 11 defaults to
# `use_pem` alone and picks its provider from exactly one of `rust_crypto` / `aws_lc_rs`.
# With neither, it still compiles and installs a provider whose verifier factory is a
# `panic!`, so the gate starts clean (the JWKS fetch and `from_jwk` never reach it) and
# aborts on the first real login, which under `panic = "abort"` kills the process and
# under `Restart=on-failure` becomes a restart loop. That is what it did in production.
# `rsa_signature_verification_works` is the test that now stands where the feature does.
# Default features off because nothing here reads a PEM (keys arrive as JWK components),
# which drops `pem` and `simple_asn1` from the tree.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HMAC-SHA256 signed session cookie.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
# CSPRNG for minting `bbk_` API keys (bb-auth-adm). The OS entropy source, nothing more,
# and it pulls in no crypto stack of its own. `ring` carries its own 0.2 of this for the
# same job, which is why two majors of it sit in the lock.
getrandom = "0.4"
# x-www-form-urlencoded body + query parsing (small, standalone).
form_urlencoded = "1"
# SIGHUP handling for the live reload of the access and settings files. Pure Rust
# + libc FFI, no system OpenSSL, keeps the aarch64 cross-compile clean.
signal-hook = { version = "0.4", features = ["iterator"] }
# HTML templating for bb-auth-web, compile-time and pure Rust (a proc macro over
# proc-macro2/quote/syn — no runtime, no C, nothing to cross-compile). It is here for its
# ESCAPING BY CONSTRUCTION: every interpolated value is escaped on the way into the page,
# so an access file full of hostile-looking emails and URL patterns cannot produce markup.
# Same shape of argument as the gate's `pct_encode` — safety is a property of the encoder,
# not of a per-value check somebody has to remember. Default features only: the web-
# framework integrations (actix/axum/rocket/…) stay off, so this pulls in no server stack.
maud = "0.27"

# `chown` when bb-auth-adm rewrites the access file: the live one is root:bb-auth 0640, and
# a rewrite that left it root:root would lock the service out of its own access list. Plain
# libc FFI: no crypto, no OpenSSL, no runtime.
#
# This is deliberately the 1.0 PRE-RELEASE, and it is the one dependency here that buys
# nothing: no other crate in the tree asks for it. sha2 (via cpufeatures), signal-hook (via
# errno) and ring (via getrandom 0.2) all still require libc 0.2, so both majors are
# compiled. Going back to "0.2" is a one-line change and removes the duplicate.
[target.'cfg(unix)'.dependencies]
libc = "1.0.0-alpha.4"

[profile.release]
opt-level = "z"   # optimize for size — tiny binary, fast enough for a gate
lto = true
codegen-units = 1
panic = "abort"
strip = true

# ---------------------------------------------------------------------------
# .deb packaging (cargo-deb). Driven by scripts/package.sh, which is the supported
# entry point: it stages the crate off the Windows drive, builds through
# scripts/build.sh, and packages the exact bytes that land in dist/.
#
# THREE PACKAGES, one per variant, for the same reason scripts/deploy.sh installs the
# two admin tools only if they were staged: the gate never calls either of them, and a
# host that wants only the gate must be able to have only the gate. The dependency on
# the gate is version-strict because all three link one library and must agree on what
# an access file MEANS, byte for byte; scripts/package.sh rewrites that literal from
# the crate version and the revision it was given, so the two cannot drift.
#
# NO STATE IS PACKAGED. Not etc/bb-auth.env (it carries the HMAC key: replacing it
# logs every user out), not var/lib/access.json (the live access file is the only copy
# that is current). dpkg cannot clobber a file it does not ship, so preservation here
# is by construction, not by a conffile prompt that one --force-confnew would lose.
# What ships instead is share/*.example; the maintainer scripts create the real files
# once, only when absent, and never touch them again.
#
# `systemd-units` is deliberately NOT used, though the units are packaged: the
# fragments it generates enable and start unconditionally, and a first install has an
# unconfigured env file. A fatal startup under Restart=on-failure is a boot loop, so
# deploy/debian/*/postinst does the enable and the restart itself, after the same
# preflight scripts/deploy.sh runs and only when that preflight passes.
[package.metadata.deb]
maintainer = "Emiliano De Simoni <emiliano.desimoni@outlook.com>"
section = "admin"
priority = "optional"
# There is no variant-less package: each variant below replaces this list.
assets = []

# The gate. `$auto` is not an option for `depends`: dpkg-shlibdeps cannot inspect a
# cross-compiled aarch64 binary on the build host, so the dependency is stated instead.
# libc.so.6 is the only NEEDED library (panic="abort" leaves no libgcc_s), and
# GLIBC_2.34 is the highest symbol version the release binary references:
# scripts/build.sh prints it and scripts/package.sh re-checks it against this line.
[package.metadata.deb.variants.gate]
name = "bb-auth"
depends = "libc6 (>= 2.34), passwd, init-system-helpers (>= 1.54)"
maintainer-scripts = "deploy/debian/bb-auth"
assets = [
    ["target/release/bb-auth", "opt/bb-auth/bin/", "755"],
    ["deploy/bb-auth.service", "usr/lib/systemd/system/", "644"],
    ["deploy/bb-auth.env.example", "opt/bb-auth/share/", "644"],
    ["deploy/access.example.json", "opt/bb-auth/share/", "644"],
    ["deploy/settings.example.json", "opt/bb-auth/share/", "644"],
]
extended-description = """
bb-auth validates an AWS Cognito id_token that a browser-side login page already obtained, and issues an HMAC-signed session cookie that nginx enforces on every request through auth_request. It also accepts per-request bearer credentials (a Cognito id_token or a static bbk_ API key) and enforces the access policy of the application scope that owns the request URL, read from a JSON access file.
.
The HMAC key and the access file are NOT part of this package. Both are created on first install and preserved by every later upgrade: a changed key would log every user out, and the access file is edited on the host.
"""

# The access-file admin CLI. No maintainer scripts: it owns no service, no config and
# no state, and the file it edits belongs to the gate's package.
[package.metadata.deb.variants.adm]
name = "bb-auth-adm"
depends = "bb-auth (= 1.0.0-1), libc6 (>= 2.34)"
assets = [
    ["target/release/bb-auth-adm", "opt/bb-auth/bin/", "755"],
]
extended-description = """
CRUD over a bb-auth access file: applications and their scopes, user groups, denied, users and API keys, plus `can EMAIL URL`, which answers with the gate's own decision function. Every write is re-parsed with the gate's parser on the exact bytes about to land on disk, replaced atomically, and left with the mode and owner it found.
"""

# The admin GUI. Installing it is what hands the access file to bb-auth-web:bb-auth,
# which is why this package, and not the gate's, is what sets that ownership.
[package.metadata.deb.variants.web]
name = "bb-auth-web"
depends = "bb-auth (= 1.0.0-1), libc6 (>= 2.34), passwd, init-system-helpers (>= 1.54)"
maintainer-scripts = "deploy/debian/bb-auth-web"
assets = [
    ["target/release/bb-auth-web", "opt/bb-auth/bin/", "755"],
    ["deploy/bb-auth-web.service", "usr/lib/systemd/system/", "644"],
    ["deploy/bb-auth-reload.path", "usr/lib/systemd/system/", "644"],
    ["deploy/bb-auth-reload.service", "usr/lib/systemd/system/", "644"],
    ["deploy/bb-auth-web.env.example", "opt/bb-auth/share/", "644"],
]
extended-description = """
The same CRUD as bb-auth-adm, server-rendered and made through the same library. No page needs JavaScript. It is just another app bb-auth fronts: loopback only, gated by nginx auth_request, identity read from the X-Auth-Email nginx injects and from nowhere else, with its own administrator allowlist (web.admins in the settings file) on top of that.
.
It also installs bb-auth-reload.path, which turns any rewrite of the access file into a `systemctl reload bb-auth`, so an edit from either editor goes live without anyone needing the privilege to signal the gate.
"""
